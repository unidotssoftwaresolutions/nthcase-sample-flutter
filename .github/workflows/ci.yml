# Every check. build.yml and release.yml call this workflow; it never runs on its own.
#
#   the fast checks, on every run     android: the art, analyze, the tests but the goldens, the debug APK (ubuntu)
#                                     ios: the goldens and the simulator app, zipped (macos: the goldens need its fonts,
#                                     and only a Mac builds for the iOS Simulator)
#   the device suite, when asked      android-device-ids: the ids on an Android emulator (ubuntu)
#   (`devices: true`)                 ios-device-ids: the ids on an iOS simulator, and the zip installed with simctl
#
# build.yml asks for the device suite on "Run workflow" and on the monthly schedule; release.yml always does. On a push
# or a pull request the two device jobs are skipped: no emulator and no simulator starts.
#
# Every action is named by its commit, not by a tag someone can move. The version each SHA was on 2026-11-03 is in the
# comment beside it (actions/cache: 2026-11-04). To update one, look up the new version's commit, read what changed,
# and change both. Flutter itself is the release archive, checked against its published SHA-256.
#
# Every check runs even when an earlier one failed, so one run tells everything: a check step runs once the setup it
# needs succeeded (`!cancelled()` and that step's outcome), a job that needs another's build runs whenever that build
# was uploaded, and each job still fails if any of its checks failed. Results and screenshots are uploaded either way.
#
# Cached, under keys made of what they hold: pub's packages (pubspec.lock and the Flutter version) and Gradle's folders
# (gradle/actions/setup-gradle's own keys). Only runs on main write a cache; a pull request reads it.
name: ci

on:
  workflow_call:
    inputs:
      version:
        description: What the APK and the zip are named after, mossgrove-flutter-<version>-debug.apk (the tag, or build-<run number>)
        type: string
        required: true
      devices:
        description: Run the device suite on an emulator and a simulator as well
        type: boolean
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    name: Analyze, test, APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: "21"
      # Caches Gradle's folders for the APK build (Flutter's Android build is Gradle), under Gradle's own keys.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 10
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        timeout-minutes: 10
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - timeout-minutes: 5
        run: flutter --disable-analytics && flutter --version
      - name: Cache pub's packages
        timeout-minutes: 5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - id: pub
        timeout-minutes: 10
        run: flutter pub get
      - name: The art in the app is art/, converted
        if: ${{ !cancelled() && steps.pub.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          dart run tool/convert_art.dart
          git diff --exit-code -- lib android
      - if: ${{ !cancelled() && steps.pub.outcome == 'success' }}
        timeout-minutes: 10
        run: flutter analyze
      # The goldens compare pixels drawn by the host's font engine; they run in the macOS job.
      - if: ${{ !cancelled() && steps.pub.outcome == 'success' }}
        timeout-minutes: 15
        run: flutter test --exclude-tags golden
      # The APK build needs the NDK Flutter names (android/app/build.gradle.kts: ndkVersion = flutter.ndkVersion). When
      # the runner lacks it, Gradle downloads it in the middle of the build, once, and a broken download fails the
      # build ("Error reading Zip content from a SeekableByteChannel", the v1.1.0 release run). Here it is installed
      # first, in a step of its own: up to three tries, each after removing what the last one left, then checked.
      - name: Install the NDK Flutter's build asks for
        id: ndk
        if: ${{ !cancelled() && steps.pub.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          ext="$RUNNER_TEMP/flutter/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          ndk=$(sed -n 's/.*val ndkVersion: String = "\([0-9.]*\)".*/\1/p' "$ext")
          [[ -n "$ndk" ]] || { echo "no ndkVersion in $ext: Flutter has moved it, read it from there again"; exit 1; }
          dir="$ANDROID_HOME/ndk/$ndk"
          installed() { grep -qx "Pkg.Revision *= *$ndk" "$dir/source.properties" 2>/dev/null; }
          if installed; then
            echo "NDK $ndk is on the runner already"
            exit 0
          fi
          for try in 1 2 3; do
            echo "NDK $ndk, try $try"
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" < /dev/null && installed; then
              echo "NDK $ndk installed in $dir"
              exit 0
            fi
            rm -rf "$dir" "$ANDROID_HOME/.temp"
            [[ $try == 3 ]] || sleep $((try * 15))
          done
          echo "NDK $ndk did not install in three tries"
          exit 1
      - id: apk
        if: ${{ !cancelled() && steps.pub.outcome == 'success' && steps.ndk.outcome == 'success' }}
        timeout-minutes: 20
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # a release tag must name the version the app says it is (pubspec.yaml, and the Settings line a test checks)
          if [[ "$VERSION" == v* ]]; then
            app="v$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
            [[ "$VERSION" == "$app" ]] || { echo "the tag $VERSION does not match pubspec.yaml's $app"; exit 1; }
          fi
          flutter build apk --debug
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/mossgrove-flutter-${VERSION}-debug.apk"
      - if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mossgrove-flutter-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Goldens, simulator app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        timeout-minutes: 10
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "6545b85938745dc5070e9faf2adf70233c1811009d87fe6d27bfcda5a04b7698  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - timeout-minutes: 5
        run: flutter --disable-analytics && flutter --version
      - name: Cache pub's packages
        timeout-minutes: 5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - id: pub
        timeout-minutes: 10
        run: flutter pub get
      - name: Golden screenshots (docs/screenshots)
        id: goldens
        if: ${{ !cancelled() && steps.pub.outcome == 'success' }}
        timeout-minutes: 15
        run: flutter test --tags golden
      - if: ${{ !cancelled() && steps.goldens.outcome == 'failure' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: test/failures/
          retention-days: 7
      - name: Build the simulator app (arm64 and x86_64)
        id: build
        if: ${{ !cancelled() && steps.pub.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          flutter build ios --simulator --debug --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios/DerivedData -jobs 4 \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Zip it
        id: zip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist/app
          cp -R build/ios/DerivedData/Build/Products/Debug-iphonesimulator/Runner.app dist/app/Mossgrove.app
          lipo -info dist/app/Mossgrove.app/Runner
          (cd dist/app && ditto -c -k --sequesterRsrc --keepParent Mossgrove.app "../mossgrove-flutter-${VERSION}-simulator.zip")
          rm -rf dist/app
      - if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mossgrove-flutter-simulator
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # The proof that the ids reach Appium: the tree UiAutomator2 reads, on an emulator (GitHub's machine). Device suite.
  android-device-ids:
    name: Ids on an Android emulator
    needs: android
    if: ${{ inputs.devices && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-flutter-apk
          path: dist
      - name: Let the emulator use KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 40
        env:
          APK: dist/mossgrove-flutter-${{ inputs.version }}-debug.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # the walk goes through every part even when one fails, then fails once with every missing id
          script: |
            adb install -r "$APK"
            python3 tool/android_ids_check.py --out build/android-ids
      - if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ids
          path: build/android-ids/
          if-no-files-found: ignore
          retention-days: 14

  # The same proof for iOS: XCUITest's tree, the one Appium's XCUITest driver reads, on a simulator. It also installs
  # the zipped simulator app on the newest iOS simulator with simctl, as NthCase does. Device suite.
  ios-device-ids:
    name: Ids on an iOS simulator
    needs: ios
    if: ${{ inputs.devices && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-flutter-simulator
          path: dist
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        timeout-minutes: 10
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "6545b85938745dc5070e9faf2adf70233c1811009d87fe6d27bfcda5a04b7698  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Cache pub's packages
        timeout-minutes: 5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - timeout-minutes: 10
        run: flutter --disable-analytics && flutter pub get
      - name: Pick a simulator on the newest iOS runtime, by its UDID
        id: sim
        timeout-minutes: 5
        run: |
          read -r runtime devicetype < <(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          r = max(rs, key=lambda r: [int(p) for p in r["version"].split(".")])
          phones = [d["identifier"] for d in r["supportedDeviceTypes"] if d["productFamily"] == "iPhone"]
          print(r["identifier"], phones[-1])')
          udid=$(xcrun simctl create mossgrove-ci "$devicetype" "$runtime")
          echo "runtime=$runtime udid=$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install the zipped app with simctl and start it
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        timeout-minutes: 15
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          ZIP: dist/mossgrove-flutter-${{ inputs.version }}-simulator.zip
        run: |
          unzip -q "$ZIP" -d dist/app
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" dist/app/Mossgrove.app
          xcrun simctl launch "$UDID" com.nthcase.sample
          sleep 10
          xcrun simctl spawn "$UDID" launchctl list | grep -q com.nthcase.sample
          xcrun simctl terminate "$UDID" com.nthcase.sample
      # one test per part of the walk, each from a fresh launch; every missing id is reported with its line
      - name: XCUITest reads every screen's ids
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        timeout-minutes: 35
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          flutter build ios --simulator --debug --no-codesign --config-only
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/ios/DerivedData -jobs 4 \
            -only-testing:RunnerUITests -resultBundlePath build/ios-ids.xcresult CODE_SIGNING_ALLOWED=NO
      - name: The screenshots and trees, out of the result bundle
        if: always()
        timeout-minutes: 5
        run: |
          [ -d build/ios-ids.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/ios-ids.xcresult --output-path build/ios-ids-attachments \
            || echo "could not export the attachments; they are in ios-ids.xcresult"
      - if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ids
          path: |
            build/ios-ids.xcresult
            build/ios-ids-attachments/
          if-no-files-found: ignore
          retention-days: 14
