# On a v* tag: every check (ci.yml, the fast checks and the device suite on an emulator and a simulator), and only when
# all of them are green, the GitHub Release with the debug-signed APK, the zipped simulator app and SHA256SUMS. A red
# check publishes nothing.
#
# No concurrency: a release is never cancelled halfway.
#
# No secrets: the APK is signed with the build's own debug key, and the simulator app needs no signing, which is what
# lets anyone install and test them. The token is the run's own GITHUB_TOKEN, and only the release job can write.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}
      devices: true

  github-release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-flutter-apk
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-flutter-simulator
          path: dist
      - name: Create the release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum ./*.apk ./*.zip > SHA256SUMS
          gh release create "$TAG" ./* --repo "$REPO" --title "Mossgrove for Flutter $TAG" \
            --notes "Debug builds of the Mossgrove sample app, for testing with NthCase. Android: a debug-signed APK (adb install mossgrove-flutter-${TAG}-debug.apk). iOS: a simulator app for arm64 and x86_64, zipped (unzip it, then xcrun simctl install <udid> Mossgrove.app). SHA256SUMS lists their checksums."
