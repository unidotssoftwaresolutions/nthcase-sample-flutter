# On a v* tag: test, build the debug-signed APK and the zipped simulator app, and attach both to a GitHub Release.
#
# No secrets: the APK is signed with the build's own debug key, and the simulator app needs no signing, which is what
# lets anyone install and test them. The token is the run's own GITHUB_TOKEN, and only the release job can write.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - run: flutter build apk --debug
      - name: Name the APK after the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/mossgrove-flutter-${TAG}-debug.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "6545b85938745dc5070e9faf2adf70233c1811009d87fe6d27bfcda5a04b7698  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      - run: flutter test --tags golden
      - name: Build the simulator app (arm64 and x86_64) and zip it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          flutter build ios --simulator --debug --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios/DerivedData -jobs 4 \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p dist/app
          cp -R build/ios/DerivedData/Build/Products/Debug-iphonesimulator/Runner.app dist/app/Mossgrove.app
          (cd dist/app && ditto -c -k --sequesterRsrc --keepParent Mossgrove.app "../mossgrove-flutter-${TAG}-simulator.zip")
          rm -rf dist/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: dist/
          if-no-files-found: error

  github-release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum ./*.apk ./*.zip > SHA256SUMS
          gh release create "$TAG" ./* --repo "$REPO" --title "Mossgrove for Flutter $TAG" \
            --notes "Debug builds of the Mossgrove sample app, for testing with NthCase. Android: a debug-signed APK (adb install mossgrove-flutter-${TAG}-debug.apk). iOS: a simulator app for arm64 and x86_64, zipped (unzip it, then xcrun simctl install <udid> Mossgrove.app). SHA256SUMS lists their checksums."
