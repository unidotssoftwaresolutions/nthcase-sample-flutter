name: mossgrove
description: "Mossgrove: an NthCase sample app for Flutter"
publish_to: 'none'

# 1.0.0 builds spec 1.0. The version line on the Settings screen says the same (a test checks it).
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Runtime packages: Flutter's own only, all published by flutter.dev (SPEC.md §2, §12). The README lists each one,
# with the packages they bring in.
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  # the platform halves of webview_flutter, named here for their debug-inspection switches
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

# Test and build tools: they never ship in the app.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No icon font: every icon is a drawing from art/ (SPEC.md §2, §10).
  uses-material-design: false
  assets:
    - assets/web/care-guide.html
